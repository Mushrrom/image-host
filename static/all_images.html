<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Image Grid</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin: 0;
                padding: 0;
                background-color: #f8f8f8;
            }

            .container {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
                padding: 20px;
                width: 100%;
                max-width: 1200px;
                font-family: "Source Code Pro", monospace;
            }

            .image-box {
                display: flex;
                flex-direction: column;
                align-items: left;
                padding: 10px;
                background-color: #fefef8;
                border-radius: 10px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }

            .image-box img {
                max-width: 100%;
                height: auto;
            }

            .image-box p {
                margin: 0;
                text-align: center;
            }
        </style>
    </head>
    <a href="/collections">view my collections</a>
    <a href="/upload">upload an image</a>
    <body>
        <div class="container" id="image-container">
            <!-- js automatically adds images here :3 -->
        </div>
        <button onclick="addImageBox('image.jpg', 'Sample Text')">
            Add Image Box
        </button>
        <script src="all_images.js"></script>
    </body>
</html>
