<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Imagen - upload image</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
            rel="stylesheet"
        />
        <style>
            header {
                font-family: "Source Code Pro", monospace;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin: 0;
                padding: 0;
                background-color: #f8f8f8;
            }

            body {
                font-family: "Source Code Pro", monospace;

                background-color: #f8f8f8;
            }

            input {
                padding: 10px 15px;
                margin: 10px 0;
                border: 2px solid #ccc;
                background-color: #f9f9f9;
                box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
                color: #333;
                transition: all 0.3s ease;
                font-family: "Source Code Pro", monospace;
            }

            /* when the input is hovered on - will be lighter than when clicked */
            input:hover {
                border-color: #007bff7c;
                background-color: #ffffff;
                box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
                outline: none;
            }

            /* when the input is clicked */
            input:focus {
                border-color: #007bff;
                background-color: #ffffff;
                box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
                outline: none;
            }
        </style>
    </head>
    <header>
        <a href="/my_collections">view my collections</a>
        <a href="/all_images">View all my images</a>
    </header>
    <body>
        <h1>Upload an image</h1>
        <input
            style="display: inline-block"
            type="file"
            value="click to select image"
            id="image_picker"
        />
        <input
            style="display: inline-block"
            type="button"
            value="upload"
            id="image_upload"
            onclick="upload_image()"
        />
    </body>
    <script src="upload.js"></script>
</html>
